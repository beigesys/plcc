# plcc Demo: PLC on emulated hardware + FUXA SCADA
#
#   just demo-up                           — default STM32F4 + water treatment
#   just demo-up board=nucleo_h753zi       — different board
#   just demo-down                         — stop
#
#   http://localhost:1881                  — FUXA SCADA
#   telnet localhost 5021                  — PLC debug console
#   FUXA Modbus config: host=plc port=5020

services:
  plc:
    build:
      context: ..
      dockerfile: demo/Dockerfile.plc
      args:
        BOARD: ${BOARD:-stm32f4_discovery}
        PROGRAM: ${PROGRAM:-water_treatment.st}
        PLC_NAME: ${PLC_NAME:-watertreatment}
    ports:
      - "5020:5020"   # Modbus RTU
      - "5021:5021"   # Debug console
    restart: unless-stopped

  fuxa:
    image: frangoteam/fuxa:latest
    ports:
      - "1881:1881"
    restart: unless-stopped
