# plcc Demo: Water Treatment PLC + FUXA SCADA
#
#   just demo-up       — start PLC + FUXA
#   just demo-down     — stop
#   just demo-save     — export FUXA dashboard to JSON
#
#   http://localhost:1881       — FUXA SCADA dashboard
#   PLC Modbus TCP on port 502 — FUXA connects to plc:502

services:
  plc:
    build:
      context: ..
      dockerfile: demo/Dockerfile.plc
    ports:
      - "502:502"
    restart: unless-stopped

  fuxa:
    image: frangoteam/fuxa:latest
    ports:
      - "1881:1881"
    volumes:
      - ./fuxa/project.json:/project/project.json:ro
      - ./fuxa/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    working_dir: /usr/src/app/FUXA/server
    depends_on:
      - plc
    restart: unless-stopped
