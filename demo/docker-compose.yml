# plcc Demo: Water Treatment PLC on emulated STM32F4 + FUXA SCADA
#
#   just demo-up     → start everything
#   just demo-down   → stop
#   just demo-logs   → PLC debug console
#
#   http://localhost:1881   → FUXA SCADA
#   localhost:5020          → Modbus RTU (Renode UART bridge)

services:
  plc:
    build:
      context: ..
      dockerfile: demo/Dockerfile.plc
    network_mode: host
    restart: unless-stopped

  fuxa:
    image: frangoteam/fuxa:latest
    network_mode: host
    volumes:
      - fuxa_data:/var/lib/fuxa
    restart: unless-stopped

volumes:
  fuxa_data:
