# plcc Demo: Water Treatment PLC on Renode STM32F4 + FUXA SCADA
#
# Architecture:
#   Renode (STM32F4) ←── UART/Modbus RTU ──→ ser2net ──→ FUXA (Modbus TCP)
#
# Usage:
#   docker compose up -d
#   Open http://localhost:1881 (FUXA)
#   Connect Modbus TCP device: host=localhost port=5020

services:
  # Build the ARM firmware from ST source
  firmware:
    build:
      context: ..
      dockerfile: demo/Dockerfile.plc
    volumes:
      - firmware_vol:/output
    entrypoint: ["/bin/sh", "-c", "cp /firmware.elf /output/firmware.elf"]

  # Renode: emulates STM32F4 Discovery running the PLC firmware
  renode:
    image: antmicro/renode:latest
    depends_on:
      firmware:
        condition: service_completed_successfully
    volumes:
      - firmware_vol:/firmware:ro
      - ./renode:/renode-scripts:ro
    command: >
      --disable-xwt --console
      /renode-scripts/plc_demo.resc
    network_mode: host
    restart: unless-stopped

  # FUXA SCADA dashboard
  fuxa:
    image: frangoteam/fuxa:latest
    network_mode: host
    volumes:
      - fuxa_data:/var/lib/fuxa
    restart: unless-stopped

volumes:
  firmware_vol:
  fuxa_data:
