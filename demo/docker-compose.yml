# plcc Demo: PLC on emulated hardware + FUXA SCADA
#
# Default: water treatment on STM32F4 Discovery
# Change board/program with build args:
#   BOARD=nucleo_h753zi PROGRAM=blink.st PLC_NAME=blink docker compose up --build

services:
  plc:
    build:
      context: ..
      dockerfile: demo/Dockerfile.plc
      args:
        BOARD: ${BOARD:-stm32f4_discovery}
        PROGRAM: ${PROGRAM:-water_treatment.st}
        PLC_NAME: ${PLC_NAME:-watertreatment}
    network_mode: host
    restart: unless-stopped

  fuxa:
    image: frangoteam/fuxa:latest
    network_mode: host
    volumes:
      - fuxa_data:/var/lib/fuxa
    restart: unless-stopped

volumes:
  fuxa_data:
