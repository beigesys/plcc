plcc-runtime = { version = "0.1.0", path = "../plcc-runtime" }
plcc-st = { version = "0.1.0", path = "../plcc-st" }
plcc-stdlib = { version = "0.1.0", path = "../plcc-stdlib" }
plcc-twincat = { version = "0.1.0", path = "../plcc-twincat" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
