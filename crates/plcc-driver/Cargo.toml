[package]
name = "plcc-driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miette = "7.6.0"
plcc-hir = { version = "0.1.0", path = "../plcc-hir" }
plcc-l5x = { version = "0.1.0", path = "../plcc-l5x" }
