[package]
name = "plcc"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
inkwell = { version = "0.8.0", features = ["llvm21-1"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
plcc-codegen = { version = "0.1.0", path = "../plcc-codegen" }
plcc-hir = { version = "0.1.0", path = "../plcc-hir" }
plcc-st = { version = "0.1.0", path = "../plcc-st" }
