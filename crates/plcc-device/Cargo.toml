[package]
name = "plcc-device"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miette = "7.6.0"
plcc-runtime = { version = "0.1.0", path = "../plcc-runtime" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std", "display"] }

